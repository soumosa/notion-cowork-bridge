name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # The suite exercises a real Bun install through run_terminal_command.
      # Without this the Bun case skips itself instead of failing.
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      # zsh ships with macOS but not with the Ubuntu runner image, and the
      # macOS scripts need it for their own -n syntax check below.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      # ubuntu-latest and macos-latest ship shellcheck already; windows-latest
      # does not, and check.mjs shellchecks scripts/bridge on every OS.
      - if: runner.os == 'Windows'
        run: choco install shellcheck --no-progress -y
      # Not guaranteed to be preinstalled with every PowerShell on every OS,
      # so install it explicitly rather than hope.
      - shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
      # Every GitHub runner image ships PowerShell, so this also parses the
      # Windows scripts on Linux and macOS. CHECK_STRICT means a checker
      # silently vanishing from a runner image fails the build instead of
      # quietly checking less than it used to.
      - run: npm run check
        env:
          CHECK_STRICT: "1"
      # Runs the whole suite, including the installer tests under
      # test/installers/; each one skips itself on the wrong OS, so this
      # matrix naturally gives each platform's installer its own real run.
      - run: npm test
      - run: npm audit --omit=dev
