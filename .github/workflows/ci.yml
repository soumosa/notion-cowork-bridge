name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # The suite exercises a real Bun install through run_terminal_command.
      # Without this the Bun test skips itself instead of failing.
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev
